<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>2026 扣件展｜拜訪打勾</title>

<!-- Firebase compat SDK (全域可用，最穩定) -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#0f1117;color:#e8eaf0;overflow:hidden;height:100dvh}
.app{display:grid;grid-template-columns:260px 1fr;height:100dvh}
.sidebar{background:#1a1d27;border-right:1px solid #2e3350;display:flex;flex-direction:column;overflow:hidden}
.main{display:flex;flex-direction:column;overflow:hidden;min-width:0}
@media(max-width:767px){
  body{overflow:auto;height:auto}
  .app{display:flex;flex-direction:column;height:auto;min-height:100dvh}
  .sidebar{display:none}
  .sidebar.open{display:flex;position:fixed;inset:0;z-index:200;width:85vw;max-width:320px;box-shadow:4px 0 24px rgba(0,0,0,.6)}
  .overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:199}
  .overlay.show{display:block}
  .main{flex:1}
  .mob-header{display:flex;align-items:center;gap:10px;padding:10px 12px;background:#1a1d27;border-bottom:1px solid #2e3350;position:sticky;top:0;z-index:100}
  .mob-header h1{font-size:14px;font-weight:700;flex:1}
  .prog-mini{font-size:11px;color:#16a34a;white-space:nowrap}
  .hamburger{background:none;border:1px solid #2e3350;border-radius:6px;color:#e8eaf0;cursor:pointer;padding:6px 8px;font-size:16px;line-height:1}
  .map-cont{overflow:auto;-webkit-overflow-scrolling:touch}
}
@media(min-width:768px){
  .mob-header{display:none}
  .overlay{display:none!important}
}
.sb-top{padding:10px;border-bottom:1px solid #2e3350;flex-shrink:0}
.sb-logo{font-size:13px;font-weight:700;margin-bottom:8px;display:flex;align-items:center;justify-content:space-between}
.sb-close{display:none;background:none;border:none;color:#7a80a0;font-size:20px;cursor:pointer;padding:0 4px}
@media(max-width:767px){.sb-close{display:block}}
.sync-dot{width:8px;height:8px;border-radius:50%;background:#f59e0b;display:inline-block;margin-right:5px;flex-shrink:0}
.sync-dot.live{background:#22c55e}
.sync-dot.err{background:#ef4444}
.search-box{width:100%;padding:7px 10px;font-size:13px;border:1px solid #2e3350;border-radius:6px;background:#22263a;color:#e8eaf0;outline:none;margin-bottom:8px}
.search-box:focus{border-color:#4f9cf9}
.filter-row{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:8px}
.fp{padding:4px 10px;font-size:11px;border:1px solid #2e3350;border-radius:20px;cursor:pointer;background:#22263a;color:#7a80a0}
.fp.active{background:#1a3a6b;border-color:#4f9cf9;color:#e8eaf0}
.pb-label{font-size:11px;color:#7a80a0;margin-bottom:4px}
.pb-track{height:5px;background:#2e3350;border-radius:3px;overflow:hidden}
.pb-fill{height:100%;background:#22c55e;border-radius:3px;transition:width .4s}
.pb-num{font-size:11px;color:#16a34a;margin-top:3px;font-weight:600}
.vendor-list{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:4px 0}
.vendor-list::-webkit-scrollbar{width:3px}
.vendor-list::-webkit-scrollbar-thumb{background:#2e3350;border-radius:2px}
.grp-hdr{padding:7px 12px 3px;font-size:9px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:#7a80a0}
.vi{display:flex;align-items:center;gap:8px;padding:8px 12px;border-left:3px solid transparent}
.vi.done .vn{text-decoration:line-through;color:#7a80a0}
.vdot{width:7px;height:7px;border-radius:50%;flex-shrink:0}
.vn{font-size:12px;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;cursor:pointer}
.vb{font-size:10px;font-family:monospace;color:#7a80a0;background:#22263a;padding:1px 5px;border-radius:3px;white-space:nowrap}
.chk{width:18px;height:18px;flex-shrink:0;cursor:pointer;accent-color:#22c55e}
.tabs{display:flex;border-bottom:1px solid #2e3350;background:#1a1d27;padding:0 12px;flex-shrink:0;overflow-x:auto}
.tab{background:none;border:none;border-bottom:2px solid transparent;color:#7a80a0;cursor:pointer;font-size:13px;font-weight:500;padding:10px 12px;margin-bottom:-1px;white-space:nowrap}
.tab.active{color:#4f9cf9;border-bottom-color:#4f9cf9}
.tab-content{display:none;flex:1;overflow:hidden;flex-direction:column;min-height:0}
.tab-content.active{display:flex}
.detail{background:#22263a;border-bottom:1px solid #2e3350;padding:8px 12px;min-height:44px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;flex-shrink:0}
.detail.empty{color:#7a80a0;font-size:12px}
.d-grp{font-size:15px;font-weight:700;font-family:monospace}
.d-name{font-size:12px;flex:1}
.d-done{font-size:11px;font-weight:600;color:#16a34a;padding:2px 7px;background:rgba(34,197,94,.15);border-radius:10px;white-space:nowrap}
.syncbar{font-size:11px;color:#7a80a0;padding:4px 12px;background:#1a1d27;border-bottom:1px solid #2e3350;flex-shrink:0;display:flex;align-items:center;gap:6px}
.map-cont{flex:1;overflow:auto;-webkit-overflow-scrolling:touch;padding:10px}
.map-wrap{position:relative;display:inline-block;min-width:720px}
.map-wrap img{display:block;width:100%;height:auto;user-select:none}
.map-ov{position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none}
.zone{position:absolute;cursor:pointer;pointer-events:all;border-radius:4px}
.legend{display:flex;gap:6px;flex-wrap:wrap;padding:6px 12px;border-bottom:1px solid #2e3350;background:#1a1d27;flex-shrink:0;overflow-x:auto}
.leg-item{display:flex;align-items:center;gap:4px;font-size:10px;color:#7a80a0;cursor:pointer;white-space:nowrap}
.leg-dot{width:8px;height:8px;border-radius:2px;flex-shrink:0}
.tbl-wrap{flex:1;overflow:auto;-webkit-overflow-scrolling:touch}
table{width:100%;border-collapse:collapse;font-size:12px}
thead tr{background:#22263a;position:sticky;top:0;z-index:5}
th{padding:8px 10px;text-align:left;font-size:9px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:#7a80a0;border-bottom:1px solid #2e3350;white-space:nowrap}
td{padding:7px 10px;border-bottom:1px solid rgba(46,51,80,.4)}
tbody tr{cursor:pointer}
tbody tr.done-row td:nth-child(2){text-decoration:line-through;color:#7a80a0}
.badge{display:inline-block;border-radius:4px;font-size:10px;font-weight:600;padding:2px 6px}
.chk-td{text-align:center;width:40px}
@media(max-width:767px){.hide-mob{display:none}}
.map-hint{display:none;font-size:11px;color:#7a80a0;padding:4px 12px;flex-shrink:0}
@media(max-width:767px){.map-hint{display:block}}
#tooltip{position:fixed;z-index:9999;background:#1a1d27;border:1px solid #2e3350;border-radius:8px;padding:8px 12px;font-size:11px;pointer-events:none;display:none;max-width:200px;color:#e8eaf0}
@media(max-width:767px){#tooltip{display:none!important}}
</style>
</head>

const ZONES=[
  ["N-A",68.5,13.5,28.3,22.0],["N-B",56.5,13.5,12.0,22.0],["N-B",43.5,13.5,13.0,22.0],
  ["N-C",30.2,13.5,13.3,22.0],["N-D",17.2,13.5,13.0,22.0],
  ["S-A",68.8,41.5,28.0,24.0],["S-B",56.5,41.5,12.3,24.0],["S-B",52.5,41.5,4.0,24.0],
  ["S-C",30.0,41.5,22.5,24.0],["S-D",17.2,41.5,12.8,24.0]
];
const LABEL_ZONES={
  "N-A":[68.5,13.5,28.3,22.0],"N-B":[43.5,13.5,25.0,22.0],"N-C":[30.2,13.5,13.3,22.0],"N-D":[17.2,13.5,13.0,22.0],
  "S-A":[68.8,41.5,28.0,24.0],"S-B":[43.0,41.5,25.8,24.0],"S-C":[30.0,41.5,22.5,24.0],"S-D":[17.2,41.5,12.8,24.0]
};

let visited={}, selGroup=null, filterPerson="all", query="";

function setSync(ok, msg){
  ["sdot","sdot2"].forEach(id=>{
    const el=document.getElementById(id);
    if(el)el.className="sync-dot"+(ok?" live":" err");
  });
  const sm=document.getElementById("syncmsg");
  if(sm)sm.textContent=msg;
  const pm=document.getElementById("prog-mini");
  if(pm&&!ok)pm.textContent="連線失敗";
}

// 即時監聽
visitedRef.on("value", snap=>{
  visited = snap.val() || {};
  setSync(true,"即時同步中 ✓");
  updateAll();
}, err=>{
  setSync(false,"連線失敗，請重新整理");
  console.error("Firebase error:", err);
});

function toggleV(id, booth, grp, checked){
  const k = id+"_"+booth+"_"+grp;
  const updates = {};
  updates[k] = checked ? true : null;
  visitedRef.update(updates).catch(e=>{
    alert("儲存失敗："+e.message);
  });
}

function isV(id,b,g){return !!(visited&&visited[id+"_"+b+"_"+g]);}
function doneInGroup(g){return RAW.filter(r=>r[3]===g&&isV(r[0],r[2],r[3])).length;}

function updateAll(){
  updateProg(); renderSidebar(); renderTable(); buildOv(); renderDetail(); renderLegend();
}

function updateProg(){
  const done=RAW.filter(r=>isV(r[0],r[2],r[3])).length;
  const pct=Math.round(done/RAW.length*100);
  document.getElementById("pbfill").style.width=pct+"%";
  document.getElementById("pbnum").textContent=done+" / "+RAW.length+" 家已拜訪";
  const pm=document.getElementById("prog-mini");
  if(pm)pm.textContent=done+"/"+RAW.length;
}

function buildOv(){
  const ov=document.getElementById("mapov");
  let html="";
  ZONES.forEach(([grp,l,t,w,h])=>{
    const g=GROUPS[grp];
    const isSel=selGroup===grp, filt=filterPerson!=="all"&&g.person!==filterPerson;
    const op=filt?0.05:(isSel?0.65:0.3);
    const border=isSel?"2px solid "+g.color:"1px solid "+g.color+"88";
    const bg=g.color+Math.round(op*255).toString(16).padStart(2,"0");
    html+=`<div class="zone" style="left:${l}%;top:${t}%;width:${w}%;height:${h}%;background:${bg};border:${border};" onclick="selectG('${grp}')" onmouseenter="showTip(event,'${grp}')" onmouseleave="hideTip()"></div>`;
  });
  Object.entries(LABEL_ZONES).forEach(([grp,[l,t,w,h]])=>{
    const g=GROUPS[grp];
    if(filterPerson!=="all"&&g.person!==filterPerson)return;
    const done=doneInGroup(grp);
    const cx=l+w/2, cy=t+h/2;
    html+=`<div style="position:absolute;left:${cx}%;top:${cy}%;transform:translate(-50%,-50%);pointer-events:none;text-align:center;z-index:10;"><div style="background:rgba(0,0,0,.72);border-radius:5px;padding:2px 6px;"><div style="font-size:9px;font-weight:700;color:${g.color};font-family:monospace">${grp}</div><div style="font-size:9px;color:#fff">${g.person}</div><div style="font-size:8px;color:#86efac">${done}/${g.count}</div></div></div>`;
  });
  ov.innerHTML=html;
}

const tt=document.getElementById("tooltip");
function showTip(e,grp){
  const g=GROUPS[grp],done=doneInGroup(grp);
  const sample=RAW.filter(r=>r[3]===grp).slice(0,4).map(r=>r[1]).join("<br>");
  tt.innerHTML=`<div style="font-weight:700;color:${g.color};margin-bottom:4px">${grp} · ${g.person}</div><div style="color:#16a34a;margin-bottom:4px">${done}/${g.count} 已拜訪</div><div style="color:#b0b8cc">${sample}</div>`;
  tt.style.display="block";
  tt.style.left=(e.clientX+14)+"px";
  tt.style.top=(e.clientY-10)+"px";
}
function hideTip(){tt.style.display="none";}

function selectG(grp){
  selGroup=grp; buildOv(); renderDetail(); renderSidebar(); renderLegend();
  if(window.innerWidth<768)closeSidebar();
}

function renderDetail(){
  const d=document.getElementById("detail");
  if(!selGroup){d.className="detail empty";d.textContent="點選地圖區域查看詳情";return;}
  const g=GROUPS[selGroup],done=doneInGroup(selGroup);
  d.className="detail";
  d.innerHTML=`<span class="d-grp" style="color:${g.color}">${selGroup}</span><span class="d-name">${g.person} · ${g.count}家</span><span class="d-done">${done}/${g.count} 已拜訪</span>`;
}

function renderLegend(){
  let html="";
  Object.entries(GROUPS).forEach(([k,g])=>{
    const done=doneInGroup(k);
    html+=`<div class="leg-item" onclick="selectG('${k}')"><div class="leg-dot" style="background:${g.color}"></div><span>${k} ${g.person} ${done}/${g.count}</span></div>`;
  });
  document.getElementById("legend").innerHTML=html;
}

function renderSidebar(){
  const q=query.toLowerCase();
  const grouped={};
  RAW.forEach(r=>{
    const [id,name,booth,grp]=r,p=GROUPS[grp].person;
    if(filterPerson!=="all"&&p!==filterPerson)return;
    if(q&&!name.toLowerCase().includes(q)&&!booth.toLowerCase().includes(q))return;
    if(!grouped[grp])grouped[grp]=[];
    grouped[grp].push(r);
  });
  if(!Object.keys(grouped).length){document.getElementById("vlist").innerHTML='<div style="padding:16px 12px;font-size:12px;color:#7a80a0">無符合廠商</div>';return;}
  let html="";
  Object.keys(GROUPS).forEach(gk=>{
    if(!grouped[gk])return;
    const g=GROUPS[gk],doneC=grouped[gk].filter(r=>isV(r[0],r[2],r[3])).length;
    html+=`<div class="grp-hdr" style="color:${g.color}">${gk} · ${g.person} · ${doneC}/${grouped[gk].length}</div>`;
    grouped[gk].forEach(r=>{
      const [id,name,booth,grp]=r,done=isV(id,booth,grp);
      html+=`<div class="vi${done?" done":""}"><div class="vdot" style="background:${GROUPS[grp].color}"></div><span class="vn" onclick="selectG('${grp}')">${name}</span><span class="vb">${booth}</span><input class="chk" type="checkbox" ${done?"checked":""} onchange="toggleV(${id},'${booth}','${grp}',this.checked)"></div>`;
    });
  });
  document.getElementById("vlist").innerHTML=html;
}

function renderTable(){
  const q=query.toLowerCase();
  const rows=RAW.filter(r=>{
    if(filterPerson!=="all"&&GROUPS[r[3]].person!==filterPerson)return false;
    if(q&&!r[1].toLowerCase().includes(q)&&!r[2].toLowerCase().includes(q))return false;
    return true;
  }).sort((a,b)=>a[2].localeCompare(b[2]));
  let html="";
  rows.forEach(([id,name,booth,grp])=>{
    const g=GROUPS[grp],done=isV(id,booth,grp);
    html+=`<tr class="${done?"done-row":""}" onclick="selectG('${grp}')"><td style="font-family:monospace;font-size:11px;color:${g.color}">${booth}</td><td>${name}</td><td class="hide-mob" style="font-size:11px;font-weight:600;color:${g.color}">${g.person}</td><td class="hide-mob"><span class="badge" style="background:${g.color}22;color:${g.color}">${grp}</span></td><td class="chk-td"><input type="checkbox" class="chk" ${done?"checked":""} onclick="event.stopPropagation();toggleV(${id},'${booth}','${grp}',this.checked)"></td></tr>`;
  });
  document.getElementById("tbody").innerHTML=html||'<tr><td colspan="5" style="text-align:center;padding:20px;color:#7a80a0">無符合資料</td></tr>';
}

function openSidebar(){
  document.getElementById("sidebar").classList.add("open");
  document.getElementById("overlay").classList.add("show");
  document.body.style.overflow="hidden";
}
function closeSidebar(){
  document.getElementById("sidebar").classList.remove("open");
  document.getElementById("overlay").classList.remove("show");
  document.body.style.overflow="";
}

document.querySelectorAll(".tab").forEach(btn=>{
  btn.addEventListener("click",()=>{
    document.querySelectorAll(".tab").forEach(b=>b.classList.remove("active"));
    document.querySelectorAll(".tab-content").forEach(c=>c.classList.remove("active"));
    btn.classList.add("active");
    document.getElementById("tab-"+btn.dataset.tab).classList.add("active");
    if(btn.dataset.tab==="table")renderTable();
  });
});
document.querySelectorAll(".fp").forEach(btn=>{
  btn.addEventListener("click",()=>{
    document.querySelectorAll(".fp").forEach(b=>b.classList.remove("active"));
    btn.classList.add("active");
    filterPerson=btn.dataset.p;
    selGroup=null;
    renderDetail();renderSidebar();renderLegend();buildOv();renderTable();
  });
});
document.getElementById("q").addEventListener("input",e=>{
  query=e.target.value;renderSidebar();renderTable();
});

buildOv(); renderLegend(); renderDetail();
</script>
